name: collect fuel prices

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may delay it by a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect prices of the big cities
        env:
          TANKERKOENIG_KEY: ${{ secrets.TANKERKOENIG_KEY }}
        run: python collector/collect.py
      - name: Save the new data points
        run: |
          git config user.name "price-collector"
          git config user.email "price-collector@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
